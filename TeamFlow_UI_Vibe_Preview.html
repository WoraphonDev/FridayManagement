<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Friday · Vibe UI preview</title>
    <style>
      :root {
        --ink: #323338;
        --muted: #676879;
        --line: #e6e9ef;
        --bg: #f6f7fb;
        --blue: #0073ea;
        --blue-soft: #e6f0ff;
        --purple: #9d50dd;
        --green: #008b66;
        --orange: #a66100;
        --red: #c93655;
        --navy: #292f4c;
        --shadow: 0 12px 48px #292f4c16;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--bg);
        font:
          14px/1.6 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Leelawadee UI',
          Thonburi,
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      summary {
        cursor: pointer;
      }
      button {
        color: inherit;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      button {
        border: 0;
        background: transparent;
      }
      a {
        color: var(--blue);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      input,
      select,
      textarea {
        color: var(--ink);
        background: #fff;
        border: 1px solid #c3c6d4;
        border-radius: 7px;
        padding: 10px 12px;
        min-width: 0;
        width: 100%;
      }
      textarea {
        resize: vertical;
        min-height: 92px;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--blue);
      }
      :focus-visible {
        outline: 3px solid #71a9f6;
        outline-offset: 3px;
      }
      input[type='checkbox'] {
        accent-color: var(--blue);
        width: 17px;
        height: 17px;
        margin: 0;
        flex-shrink: 0;
      }
      input[type='file'] {
        padding: 15px;
        font-size: 13px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 29px;
        letter-spacing: -0.8px;
        line-height: 1.4;
        font-weight: 650;
      }
      h2 {
        font-size: 19px;
        font-weight: 600;
      }
      h3 {
        font-size: 15px;
        font-weight: 600;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 1.7px;
        text-transform: uppercase;
        font-weight: 650;
        color: var(--muted);
      }
      .icon {
        width: 18px;
        height: 18px;
        display: inline-block;
        vertical-align: middle;
        flex-shrink: 0;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 6px;
      }
      .icon-button:hover {
        background: #e6e9ef;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 6px;
        padding: 8px 14px;
        min-height: 36px;
        white-space: nowrap;
        transition:
          background 0.16s,
          transform 0.16s,
          box-shadow 0.16s;
      }
      .button:hover {
        background: #eef0f6;
      }
      .button:active {
        transform: translateY(1px);
      }
      .button.primary {
        background: var(--blue);
        color: #fff;
      }
      .button.primary:hover {
        background: #0061c7;
        box-shadow: 0 4px 12px #0073ea26;
      }
      .button.outline {
        border: 1px solid #c3c6d4;
        background: #fff;
      }
      .button.danger {
        color: var(--red);
        background: #fff0f3;
      }
      .button.full {
        width: 100%;
        padding: 12px;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .between {
        justify-content: space-between;
      }
      .spacer {
        flex: 1;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .grid3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }
      .card {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 10px;
        padding: 22px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border-radius: 5px;
        font-size: 11px;
        font-weight: 500;
        background: #eff1f7;
        color: var(--muted);
        white-space: nowrap;
      }
      .badge.blue {
        background: var(--blue-soft);
        color: #0060be;
      }
      .badge.green {
        background: #e0f5ed;
        color: var(--green);
      }
      .badge.purple {
        background: #f0e5fc;
        color: #793bb0;
      }
      .badge.orange {
        background: #fff1d7;
        color: var(--orange);
      }
      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
        font-size: 11px;
        font-weight: 650;
        border: 2px solid #fff;
        background: #e9e1fb;
        color: #7041a8;
      }
      .avatar-stack {
        display: flex;
      }
      .avatar-stack .avatar {
        margin-left: -7px;
      }
      .avatar-stack .avatar:first-child {
        margin-left: 0;
      }
      .av2 {
        background: #e1f2ef;
        color: #177f6c;
      }
      .av3 {
        background: #fff0dc;
        color: #975e19;
      }
      .av4 {
        background: #e1edff;
        color: #2c65b1;
      }
      .brand {
        display: flex;
        gap: 9px;
        align-items: center;
        white-space: nowrap;
        font-size: 24px;
        font-weight: 750;
        letter-spacing: -1.2px;
      }
      .brand small {
        font-size: 11px;
        letter-spacing: 0;
        font-weight: 400;
        color: var(--muted);
        display: block;
        line-height: 1.1;
        margin-left: 1px;
      }
      .brandmark {
        display: grid;
        grid-template-columns: 9px 9px;
        gap: 3px;
        transform: rotate(-8deg);
      }
      .brandmark i {
        width: 9px;
        height: 9px;
        border-radius: 3px;
        background: #00c875;
      }
      .brandmark i:nth-child(2) {
        background: #ffcb00;
      }
      .brandmark i:nth-child(3) {
        background: #ff5b74;
      }
      .brandmark i:nth-child(4) {
        background: #a25ddc;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }
      [hidden] {
        display: none !important;
      }
      .enter {
        animation: enter 0.3s var(--ease) both;
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      /* Review controls stay separate from the product interface. */
      .studio {
        background: #fff8e8;
        border-bottom: 1px solid #eddfbf;
        min-height: 44px;
        padding: 6px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 11px;
        color: #725c29;
      }
      .studio strong {
        letter-spacing: 0.5px;
        font-size: 11px;
      }
      .studio select {
        width: auto;
        padding: 4px 26px 4px 8px;
        font-size: 11px;
        border-color: #e0d4b7;
        background: #fffdf8;
      }
      .studio label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .studio .button {
        min-height: 26px;
        padding: 3px 9px;
        font-size: 11px;
      }
      .studio .studio-right {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .studio input[type='checkbox'] {
        width: 14px;
        height: 14px;
      }
      .studio .demo-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #c49a30;
      }
      .notice {
        padding: 12px 16px;
        border-radius: 7px;
        background: #eaf3ff;
        color: #22588a;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 12px;
        line-height: 1.65;
      }
      .notice.warning {
        background: #fff5de;
        color: #805711;
      }
      .notice.error {
        background: #fff0f3;
        color: #a02643;
      }
      .notice.success {
        background: #e7f6ee;
        color: #237a56;
      }
      .notice + .notice {
        margin-top: 8px;
      }
      .notice p {
        flex: 1;
      }
      .message {
        min-height: 22px;
        color: #ab2845;
        font-size: 13px;
        margin-top: 8px;
      }
      .field {
        display: grid;
        gap: 7px;
        font-size: 13px;
      }
      .field > span:first-child {
        font-weight: 550;
      }
      .hint {
        font-size: 11px;
        color: var(--muted);
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 20px 0;
      }
      .section-gap {
        margin-top: 22px;
      }
      /* Authentication */
      .auth {
        min-height: calc(100vh - 45px);
        display: grid;
        grid-template-columns: 50% 50%;
        background: #fff;
      }
      .auth-left {
        padding: 36px 9%;
        display: flex;
        flex-direction: column;
      }
      .auth-left .brand {
        margin-bottom: 50px;
      }
      .auth-form {
        width: 100%;
        max-width: 370px;
        margin: auto;
      }
      .auth-form h1 {
        font-size: 32px;
        margin: 7px 0 9px;
      }
      .auth-form .intro {
        color: var(--muted);
        margin-bottom: 28px;
      }
      .auth-form form {
        display: grid;
        gap: 16px;
      }
      .password-wrap {
        position: relative;
      }
      .password-wrap input {
        padding-right: 50px;
      }
      .password-wrap button {
        position: absolute;
        right: 6px;
        top: 6px;
      }
      .auth-foot {
        display: flex;
        justify-content: space-between;
        margin-top: 48px;
        font-size: 11px;
        color: var(--muted);
      }
      .auth-right {
        position: relative;
        overflow: hidden;
        background: #eff1fc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 55px;
      }
      .auth-right:before {
        content: '';
        position: absolute;
        width: 480px;
        height: 480px;
        border-radius: 50%;
        background: #e4def9;
        top: -240px;
        right: -180px;
      }
      .auth-right:after {
        content: '';
        position: absolute;
        width: 250px;
        height: 250px;
        border-radius: 50%;
        background: #e0ebfb;
        bottom: -150px;
        left: -100px;
      }
      .auth-copy {
        position: relative;
        z-index: 1;
        max-width: 430px;
        text-align: center;
      }
      .auth-copy h2 {
        font-size: 33px;
        line-height: 1.3;
        letter-spacing: -1px;
        margin-bottom: 14px;
      }
      .auth-copy p {
        font-size: 14px;
        color: var(--muted);
      }
      .mini-board {
        position: relative;
        margin-top: 42px;
        width: 100%;
        max-width: 480px;
        background: #fff;
        border: 1px solid #e2e0ed;
        border-radius: 12px;
        box-shadow: 0 24px 60px #38305814;
        padding: 22px;
        transform: rotate(-2deg);
      }
      .mini-head {
        display: flex;
        justify-content: space-between;
        font-weight: 650;
        font-size: 14px;
        margin-bottom: 15px;
      }
      .mini-tabs {
        display: flex;
        gap: 15px;
        font-size: 10px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 12px;
      }
      .mini-tabs span:first-child {
        color: var(--blue);
      }
      .mini-row {
        display: grid;
        grid-template-columns: 1.5fr 36px 1fr;
        align-items: center;
        gap: 10px;
        font-size: 11px;
        min-height: 45px;
        border-bottom: 1px solid var(--line);
      }
      .mini-row .status {
        height: 28px;
        font-size: 10px;
      }
      .float-card {
        position: absolute;
        background: #fff;
        box-shadow: var(--shadow);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 13px 18px;
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 12px;
        bottom: -25px;
        right: -20px;
        transform: rotate(4deg);
        animation: enter 0.65s var(--ease) both;
        animation-delay: 0.18s;
      }
      .tick-orb {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #e1f6ee;
        color: var(--green);
        display: grid;
        place-items: center;
      }
      .auth-credit {
        margin-top: 52px;
        color: #74728b;
        font-size: 11px;
        display: flex;
        gap: 18px;
      }
      .setup-form {
        max-width: 420px;
        margin: 16px auto;
      }
      .setup-form .grid2 {
        gap: 12px;
      }
      .setup-form h1 {
        font-size: 27px;
      }
      .setup-form .intro {
        margin-bottom: 20px;
      }
      /* Application shell */
      .topbar {
        height: 52px;
        background: var(--navy);
        color: #fff;
        display: flex;
        align-items: center;
        padding: 0 23px;
        gap: 22px;
      }
      .topbar .brand {
        font-size: 22px;
        min-width: 212px;
      }
      .topbar .brand small {
        color: #b4b8ce;
        font-size: 10px;
      }
      .topbar .top-title {
        font-size: 12px;
        color: #d1d4e1;
      }
      .topbar .icon-button:hover {
        background: #414761;
      }
      .topbar .avatar {
        border-color: #454b68;
      }
      .topbar button {
        color: inherit;
      }
      .topbar .bell {
        position: relative;
      }
      .bell .dot {
        position: absolute;
        top: 5px;
        right: 6px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ffcb00;
      }
      .shell {
        display: grid;
        grid-template-columns: 264px minmax(0, 1fr);
        min-height: calc(100vh - 98px);
      }
      .sidebar {
        position: sticky;
        top: 52px;
        height: calc(100dvh - 98px);
        overflow-y: auto;
        overscroll-behavior: contain;
        background: #fafbfe;
        border-right: 1px solid var(--line);
        padding: 16px 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .sidebar .nav-item {
        display: flex;
        align-items: center;
        gap: 11px;
        text-align: left;
        min-height: 44px;
        padding: 10px 12px;
        border-radius: 6px;
        width: 100%;
        font-size: 14px;
        color: #39415a;
        position: relative;
        border: 1px solid transparent;
      }
      .sidebar .nav-item:hover {
        background: #e9ecf4;
      }
      .sidebar .nav-item.active {
        background: #e7f1ff;
        color: #0055ad;
        border-color: #c7dfff;
        font-weight: 650;
        box-shadow: inset 3px 0 #0073ea;
      }
      .nav-section + .nav-section {
        margin-top: 12px;
      }
      .nav-label {
        flex: 1;
        min-width: 0;
      }
      .nav-label small {
        display: block;
        font-size: 11px;
        font-weight: 400;
        color: #667086;
        margin-top: 3px;
      }
      .sidebar .nav-item .icon {
        width: 19px;
        height: 19px;
        flex: none;
      }
      .sidebar .nav-item:focus-visible {
        outline: 2px solid #0073ea;
        outline-offset: 2px;
      }
      .nav-current {
        font-size: 10px;
        background: #cfe4ff;
        color: #0055ad;
        border-radius: 4px;
        padding: 2px 5px;
        flex: none;
      }
      .project-nav {
        min-height: 56px !important;
      }
      .sidebar-backdrop {
        position: fixed;
        inset: 0;
        z-index: 14;
        background: #252b4766;
        cursor: default;
      }
      .sidebar .nav-item .badge {
        margin-left: auto;
        background: #e4e5ed;
        font-size: 10px;
      }
      .nav-heading {
        font-size: 12px;
        letter-spacing: 0;
        color: #566079;
        padding: 8px 12px;
        font-weight: 600;
      }
      .workspace-box {
        border: 1px solid #e1e5ee;
        background: #fff;
        padding: 12px 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        border-radius: 6px;
        margin: 0 0 12px;
      }
      .workspace-box strong {
        font-size: 13px;
        display: block;
      }
      .workspace-box small {
        font-size: 11px;
        color: #667086;
      }
      .workspace-icon {
        width: 24px;
        height: 24px;
        border-radius: 5px;
        background: #8c56d5;
        color: white;
        display: grid;
        place-items: center;
        font-size: 13px;
      }
      .project-dot {
        width: 9px;
        height: 9px;
        border-radius: 3px;
        background: #9d50dd;
        margin-left: 4px;
        margin-right: 5px;
      }
      .sidebar-bottom {
        margin-top: auto;
        padding-top: 18px;
      }
      .sidebar-profile {
        padding: 14px 10px;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 12px;
      }
      .sidebar-profile strong {
        font-size: 12px;
        font-weight: 550;
      }
      .sidebar-profile small {
        display: block;
        font-size: 10px;
        color: var(--muted);
      }
      .main {
        background: #fff;
        min-width: 0;
      }
      .page-header {
        padding: 26px 30px 0;
      }
      .breadcrumbs {
        font-size: 11px;
        color: var(--muted);
        display: flex;
        gap: 9px;
        align-items: center;
        margin-bottom: 9px;
      }
      .page-header h1 .icon {
        color: #aeb1bf;
        margin-left: 8px;
      }
      .header-desc {
        color: var(--muted);
        font-size: 12px;
        margin-top: 6px;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .header-right .button {
        font-size: 12px;
      }
      .header-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
        font-size: 11px;
        color: var(--muted);
      }
      .tabs {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 30px;
        border-bottom: 1px solid var(--line);
        margin-top: 18px;
        overflow-x: auto;
      }
      .tabs button {
        display: flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
        border-bottom: 3px solid transparent;
        padding: 12px 16px;
        font-size: 12px;
        color: var(--muted);
      }
      .tabs button[aria-selected='true'] {
        border-color: var(--blue);
        color: var(--ink);
        font-weight: 550;
      }
      .tabs button:hover {
        background: #f8f9fc;
      }
      .toolbar {
        padding: 20px 30px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .toolbar .button {
        font-size: 12px;
        padding: 7px 10px;
      }
      .search-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: 5px;
      }
      .search-wrap input {
        border: 0;
        width: 180px;
        padding: 6px 3px;
        font-size: 12px;
      }
      .search-wrap:focus-within {
        outline: 2px solid #0073ea;
        border-radius: 5px;
      }
      .toolbar select {
        font-size: 12px;
        padding: 6px 9px;
        width: 126px;
        border-color: transparent;
      }
      .toolbar select:hover {
        border-color: #c3c6d4;
      }
      .result-count {
        color: var(--muted);
        font-size: 11px;
        margin-left: auto;
      }
      .content {
        padding: 0 30px 32px;
      }
      .content.padded {
        padding-top: 22px;
      }
      .filterbar {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        padding: 13px 16px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fafbfe;
        margin-bottom: 18px;
      }
      .filterbar select {
        width: 150px;
        font-size: 12px;
        padding: 7px;
      }
      .filterbar label {
        font-size: 11px;
        display: grid;
        gap: 5px;
      }
      .filterbar input {
        padding: 7px;
        font-size: 12px;
      }
      .status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        color: #fff;
        font-size: 12px;
        padding: 6px 10px;
        min-width: 90px;
        border-radius: 3px;
        white-space: nowrap;
      }
      .status.todo {
        background: #72788d;
      }
      .status.doing {
        background: #b87400;
      }
      .status.review {
        background: #9551cf;
      }
      .status.done {
        background: #009d73;
      }
      .status-cell {
        padding: 0 !important;
        width: 125px;
      }
      .status-cell .status {
        height: 43px;
        border-radius: 0;
        width: 100%;
        border: 0;
      }
      .status-cell .status:hover {
        filter: brightness(1.07);
      }
      .priority {
        font-size: 11px;
        border-radius: 4px;
        padding: 4px 8px;
        white-space: nowrap;
      }
      .priority.medium {
        background: #edf0fa;
        color: #53628c;
      }
      .priority.high {
        background: #f1e6fb;
        color: #7f3cb5;
      }
      .priority.urgent {
        background: #ffedf1;
        color: #b42c4a;
      }
      .priority.low {
        background: #eaf5ef;
        color: #398466;
      }
      .group {
        margin-bottom: 28px;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 8;
      }
      .add-group-button {
        margin: 12px 0 28px;
      }
      .group-heading {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 4px 0 10px;
        color: var(--group);
      }
      .group-heading h2 {
        font-size: 18px;
        font-weight: 500;
      }
      .group-heading small {
        font-size: 11px;
        color: var(--muted);
        margin-left: 5px;
      }
      .group-heading .icon {
        width: 16px;
      }
      .group-heading button {
        color: inherit;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .table-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-left: 4px solid var(--group, var(--blue));
        border-radius: 7px;
      }
      .task-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 850px;
        table-layout: fixed;
      }
      .task-table th {
        font-weight: 400;
        text-align: center;
        color: var(--muted);
        height: 34px;
        font-size: 11px;
        border-right: 1px solid var(--line);
        background: #fcfcff;
      }
      .task-table th:nth-child(2) {
        text-align: left;
        padding-left: 15px;
        width: 34%;
      }
      .task-table th:first-child {
        width: 32px;
      }
      .task-table td {
        height: 44px;
        border-top: 1px solid var(--line);
        border-right: 1px solid var(--line);
        padding: 7px 12px;
        text-align: center;
        font-size: 12px;
      }
      .task-table td:first-child {
        color: #a1a5b6;
        padding: 0;
      }
      .task-table td:nth-child(2) {
        text-align: left;
      }
      .task-table tr:hover td:not(.status-cell) {
        background: #f8f9fd;
      }
      .task-name {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .task-name button {
        padding: 0;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 12px;
      }
      .task-name button:hover {
        color: var(--blue);
      }
      .task-id {
        font-size: 9px;
        color: #989bae;
        margin-top: 1px;
      }
      .comment-count {
        margin-left: auto;
        color: #a4a9b8;
        display: flex;
        gap: 4px;
        align-items: center;
        font-size: 10px;
      }
      .comment-count .icon {
        width: 14px;
      }
      .timeline-pill {
        display: inline-block;
        font-size: 10px;
        background: #e8edf8;
        color: #586892;
        border-radius: 18px;
        padding: 3px 10px;
        white-space: nowrap;
      }
      .date-overdue {
        color: var(--red);
      }
      .add-row {
        padding: 9px 16px 9px 47px;
        color: var(--muted);
        font-size: 12px;
        display: block;
        border-top: 1px solid var(--line);
        width: 100%;
        text-align: left;
      }
      .add-row:hover {
        background: #f8faff;
        color: var(--blue);
      }
      .summary-row {
        display: flex;
        justify-content: flex-end;
        padding: 7px 12px;
        background: #fafbfe;
        font-size: 10px;
        color: var(--muted);
      }
      .status.todo {
        background: #c4c7d3;
        color: #30354c;
      }
      .status.doing {
        background: #fdab3d;
        color: #4d3300;
      }
      .status.review {
        background: #a25ddc;
        color: #fff;
      }
      .status.done {
        background: #00c875;
        color: #143b2a;
      }
      .table-wrap,
      .calendar-wrap,
      .gantt-wrap {
        position: relative;
      }
      /* Views */
      .kanban {
        display: grid;
        grid-template-columns: repeat(4, minmax(210px, 1fr));
        gap: 15px;
        overflow: auto;
      }
      .kanban-column {
        background: #f6f7fb;
        border-radius: 8px;
        padding: 12px;
        border-top: 4px solid var(--group);
        min-height: 390px;
      }
      .kanban-column.drag-over {
        background: #e5efff;
      }
      .column-heading {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--group);
        font-size: 13px;
        font-weight: 550;
        margin-bottom: 15px;
      }
      .column-heading small {
        color: var(--muted);
        font-size: 10px;
        font-weight: 400;
      }
      .task-card {
        background: #fff;
        border: 1px solid #e4e6ee;
        border-radius: 8px;
        padding: 14px;
        margin-bottom: 12px;
        box-shadow: 0 2px 5px #32333804;
        transition:
          transform 0.18s,
          box-shadow 0.18s;
      }
      .task-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 7px 18px #292f4c0b;
      }
      .task-card.dragging {
        opacity: 0.45;
      }
      .task-card .task-title {
        display: block;
        font-size: 13px;
        font-weight: 550;
        line-height: 1.7;
        text-align: left;
        width: 100%;
        padding: 5px 0 10px;
      }
      .card-progress {
        height: 4px;
        border-radius: 2px;
        background: #eef0f6;
        margin: 12px 0 7px;
        overflow: hidden;
      }
      .card-progress span {
        display: block;
        height: 100%;
        background: var(--group);
        transition: width 0.3s;
      }
      .task-card select {
        font-size: 10px;
        width: 96px;
        padding: 4px;
        border-color: #e2e5ed;
      }
      .calendar-wrap {
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: auto;
      }
      .calendar {
        display: grid;
        grid-template-columns: repeat(7, minmax(110px, 1fr));
        min-width: 770px;
      }
      .weekday {
        font-size: 11px;
        color: var(--muted);
        background: #fafbfe;
        padding: 12px;
        text-align: center;
        border-bottom: 1px solid var(--line);
      }
      .day {
        min-height: 116px;
        padding: 8px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        font-size: 11px;
      }
      .day.other {
        background: #fafbfe;
        color: #a8aab8;
      }
      .day.today {
        background: #f4f8ff;
      }
      .day-number {
        width: 23px;
        height: 23px;
        display: grid;
        place-items: center;
        margin-bottom: 7px;
      }
      .today .day-number {
        background: var(--blue);
        color: #fff;
        border-radius: 50%;
      }
      .calendar-event {
        display: block;
        width: 100%;
        text-align: left;
        padding: 4px 6px;
        margin: 4px 0;
        font-size: 10px;
        border-radius: 3px;
        background: var(--soft);
        color: var(--tone);
        border-left: 3px solid var(--tone);
      }
      .view-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 2px 0 18px;
        gap: 10px;
        flex-wrap: wrap;
      }
      .view-controls h2 {
        font-size: 17px;
      }
      .segmented {
        display: flex;
        border: 1px solid var(--line);
        padding: 3px;
        border-radius: 6px;
        background: #fafbfe;
      }
      .segmented button {
        padding: 5px 12px;
        font-size: 11px;
        border-radius: 4px;
      }
      .segmented button.active {
        color: var(--blue);
        background: #e6f0ff;
      }
      .gantt-wrap {
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: auto;
      }
      .gantt {
        min-width: 950px;
      }
      .gantt-head,
      .gantt-row {
        display: grid;
        grid-template-columns: 240px 1fr;
        border-bottom: 1px solid var(--line);
        min-height: 53px;
      }
      .gantt-head {
        background: #fafbfe;
        min-height: 39px;
        color: var(--muted);
        font-size: 10px;
      }
      .gantt-label {
        padding: 10px 15px;
        border-right: 1px solid var(--line);
      }
      .gantt-label button {
        font-size: 12px;
        text-align: left;
        padding: 0;
        display: block;
      }
      .gantt-label small {
        font-size: 9px;
        color: var(--muted);
      }
      .gantt-scale {
        display: grid;
        align-items: center;
        text-align: center;
      }
      .gantt-track {
        position: relative;
        background: repeating-linear-gradient(
          to right,
          transparent 0,
          transparent calc(var(--step) - 1px),
          #edf0f6 calc(var(--step) - 1px),
          #edf0f6 var(--step)
        );
        min-height: 53px;
      }
      .today-line {
        position: absolute;
        width: 1px;
        background: #0073ea;
        top: 0;
        bottom: 0;
        z-index: 1;
        pointer-events: none;
      }
      .gantt-bar {
        position: absolute;
        top: 15px;
        height: 23px;
        border-radius: 5px;
        background: var(--tone);
        color: #fff;
        text-align: left;
        padding: 2px 8px;
        font-size: 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 5px;
        transition:
          left 0.3s,
          width 0.3s;
      }
      .gantt-marker {
        position: absolute;
        top: 19px;
        width: 14px;
        height: 14px;
        background: var(--tone);
        transform: rotate(45deg);
        border-radius: 2px;
      }
      .gantt-key {
        display: flex;
        gap: 20px;
        font-size: 11px;
        color: var(--muted);
        margin-top: 12px;
      }
      .missing-dates {
        margin-top: 20px;
        padding: 16px;
        background: #f8f9fd;
        border-radius: 7px;
      }
      .missing-dates button {
        font-size: 12px;
        padding: 5px 8px;
        color: var(--blue);
      }
      .empty-state {
        padding: 70px 20px;
        text-align: center;
        display: grid;
        justify-items: center;
        gap: 12px;
      }
      .empty-art {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: #ecf2fc;
        color: #6d91c9;
        display: grid;
        place-items: center;
        transform: rotate(-5deg);
      }
      .empty-art .icon {
        width: 30px;
        height: 30px;
      }
      .skeleton {
        height: 42px;
        background: #f0f2f7;
        border-radius: 5px;
        margin: 12px 0;
        position: relative;
        overflow: hidden;
      }
      .skeleton:after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, #ffffff80, transparent);
        animation: shimmer 1.5s 3;
      }
      @keyframes shimmer {
        to {
          transform: translateX(100%);
        }
      }
      /* Overview, directories, settings */
      .welcome-banner {
        background: #f3f0fc;
        border: 1px solid #e9e3f5;
        border-radius: 10px;
        padding: 24px;
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: center;
        margin-bottom: 22px;
      }
      .welcome-banner h2 {
        font-size: 23px;
        letter-spacing: -0.4px;
        margin-bottom: 7px;
      }
      .welcome-banner p {
        font-size: 12px;
        color: #6e6881;
      }
      .welcome-orbit {
        position: relative;
        width: 85px;
        height: 85px;
        border: 1px solid #ddd2f2;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .welcome-orbit .icon {
        width: 35px;
        height: 35px;
        color: #9a64cc;
      }
      .welcome-orbit:before,
      .welcome-orbit:after {
        content: '';
        position: absolute;
        width: 13px;
        height: 13px;
        border-radius: 4px;
        background: #ffcb00;
        top: 2px;
        right: 7px;
        transform: rotate(20deg);
      }
      .welcome-orbit:after {
        background: #00c875;
        top: auto;
        bottom: 2px;
        right: auto;
        left: 7px;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin-bottom: 22px;
      }
      .metric {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 19px;
        background: #fff;
      }
      .metric label {
        display: block;
        font-size: 11px;
        color: var(--muted);
      }
      .metric strong {
        font-size: 29px;
        font-weight: 550;
        letter-spacing: -1px;
        display: block;
        margin: 7px 0 2px;
      }
      .metric small {
        font-size: 10px;
        color: var(--muted);
      }
      .metric .icon {
        float: right;
        color: #8d94aa;
      }
      .project-card {
        padding: 0;
        overflow: hidden;
        text-align: left;
        width: 100%;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .project-card:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow);
      }
      .project-cover {
        height: 70px;
        background: #f0e9fc;
        display: flex;
        align-items: center;
        padding: 18px;
        color: #9251c9;
      }
      .project-cover .icon {
        width: 28px;
        height: 28px;
      }
      .project-info {
        padding: 20px;
      }
      .project-info h3 {
        margin-bottom: 7px;
      }
      .project-info p {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 22px;
      }
      .bar-track {
        height: 6px;
        background: #eef0f6;
        border-radius: 4px;
        overflow: hidden;
        display: flex;
      }
      .bar-track span {
        height: 100%;
        transition: width 0.35s;
      }
      .project-info .bar-track {
        margin: 17px 0;
      }
      .directory-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 630px;
      }
      .directory-table th {
        font-size: 11px;
        font-weight: 400;
        color: var(--muted);
        background: #fafbfe;
        text-align: left;
        padding: 12px 16px;
      }
      .directory-table td {
        border-top: 1px solid var(--line);
        padding: 16px;
        font-size: 12px;
      }
      .person {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .person strong {
        font-weight: 550;
      }
      .person small {
        display: block;
        font-size: 10px;
        color: var(--muted);
      }
      .notification {
        display: flex;
        gap: 14px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 10px;
      }
      .notification.unread {
        background: #f7faff;
        border-left: 3px solid var(--blue);
      }
      .notification p {
        font-size: 12px;
        margin: 4px 0;
      }
      .notification time {
        font-size: 10px;
        color: var(--muted);
      }
      .notification button {
        text-align: left;
        color: var(--blue);
        font-size: 12px;
        padding: 0;
      }
      .donut {
        width: 144px;
        height: 144px;
        border-radius: 50%;
        position: relative;
        display: grid;
        place-items: center;
        margin: 20px auto;
      }
      .donut:before {
        content: '';
        position: absolute;
        inset: 20px;
        border-radius: 50%;
        background: #fff;
      }
      .donut span {
        position: relative;
        font-size: 24px;
        font-weight: 600;
        text-align: center;
        line-height: 1.2;
      }
      .donut small {
        display: block;
        font-size: 10px;
        font-weight: 400;
        color: var(--muted);
      }
      .legend {
        display: grid;
        gap: 10px;
      }
      .legend-row {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12px;
      }
      .legend-row i {
        width: 8px;
        height: 8px;
        border-radius: 2px;
      }
      .legend-row strong {
        margin-left: auto;
        font-weight: 500;
      }
      .workload {
        display: grid;
        gap: 20px;
        margin-top: 22px;
      }
      .workload-item {
        display: grid;
        grid-template-columns: 90px 1fr 25px;
        gap: 10px;
        align-items: center;
        font-size: 12px;
      }
      .workload-item .bar-track {
        height: 9px;
      }
      .settings-layout {
        display: grid;
        grid-template-columns: 210px 1fr;
        gap: 30px;
      }
      .settings-nav {
        display: grid;
        gap: 6px;
        align-content: start;
      }
      .settings-nav button {
        padding: 11px 12px;
        text-align: left;
        border-radius: 6px;
        font-size: 12px;
      }
      .settings-nav button.active {
        background: var(--blue-soft);
        color: var(--blue);
      }
      .settings-form {
        max-width: 550px;
      }
      .settings-form h2 {
        margin-bottom: 8px;
      }
      .settings-form > p {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 24px;
      }
      .step-flow {
        display: flex;
        gap: 10px;
        align-items: stretch;
        flex-wrap: wrap;
      }
      .step-flow .step {
        flex: 1;
        min-width: 130px;
        padding: 15px;
        border-radius: 8px;
        background: #f6f7fb;
      }
      .step .step-number {
        display: grid;
        place-items: center;
        width: 23px;
        height: 23px;
        border-radius: 50%;
        background: #e4edfc;
        color: #3171c4;
        font-size: 11px;
        margin-bottom: 10px;
      }
      .step strong {
        display: block;
        font-size: 12px;
      }
      .step p {
        font-size: 11px;
        color: var(--muted);
        margin-top: 6px;
      }
      .design-note {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.8;
      }
      .screen-links {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 15px;
      }
      .screen-links button {
        font-size: 12px;
      }
      .swatches {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 18px 0;
      }
      .swatch {
        font-size: 10px;
        color: var(--muted);
      }
      .swatch i {
        display: block;
        width: 75px;
        height: 42px;
        border-radius: 7px;
        margin-bottom: 7px;
      }
      .motion-demo {
        display: flex;
        gap: 18px;
        align-items: center;
        margin-top: 17px;
      }
      .motion-block {
        width: 45px;
        height: 45px;
        border-radius: 10px;
        background: #e8dcfa;
        display: grid;
        place-items: center;
        color: #8851b7;
        transition: transform 0.25s var(--ease);
      }
      .motion-block.run {
        transform: translateX(18px) rotate(8deg);
      }
      /* Drawer / dialogs */
      dialog {
        color: var(--ink);
        border: 1px solid var(--line);
        padding: 0;
        box-shadow: 0 20px 70px #181e3b26;
        background: #fff;
        max-height: 90vh;
        width: min(560px, calc(100vw - 32px));
        border-radius: 12px;
      }
      dialog::backdrop {
        background: #22284066;
        backdrop-filter: blur(2px);
      }
      dialog[open] {
        animation: enter 0.2s var(--ease);
      }
      dialog.drawer {
        max-width: 100vw;
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: auto;
        margin: 0;
        border-radius: 0;
        border-top: 0;
        border-bottom: 0;
        border-right: 0;
        width: min(640px, 100vw);
        max-height: 100dvh;
        height: 100dvh;
        animation: slide-in 0.28s var(--ease);
      }
      @keyframes slide-in {
        from {
          transform: translateX(60px);
          opacity: 0.5;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      .dialog-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        padding: 20px 24px;
        border-bottom: 1px solid var(--line);
      }

            .map((t) => {

        function generateSuccessor(previous, next) {
          if (

          const due = new Date(next.due + 'T12:00:00Z');
          const anchor = next.anchor || due.getUTCDate();
          if (next.recurrence === 'monthly') {

            const days = new Date(
              Date.UTC(due.getUTCFullYear(), due.getUTCMonth() + 1, 0),
