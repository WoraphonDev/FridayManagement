# FridayManagement on Linux + Docker (ADR-0001). Copy deploy/.env.example to deploy/.env first.
# The app intentionally refuses NODE_ENV=production until release gates pass (T-091..T-094);
# this stack runs NODE_ENV=test for rehearsal/UAT behind real HTTPS.
name: friday
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      retries: 20
  app:
    build: ..
    image: friday-app:local
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment: &app-env
      NODE_ENV: test
      HOST: 0.0.0.0
      PORT: '3000'
      APP_ORIGIN: ${FRIDAY_ORIGIN:-https://${FRIDAY_HOST}}
      COOKIE_SECURE: 'true'
      DATA_DIR: /data
      LOG_DIR: /logs
      TRUSTED_PROXY: 172.30.0.10
      DB_PROVIDER: postgres
      DB_SERVER: db
      DB_PORT: '5432'
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ENCRYPT: 'false'
    volumes:
      - appdata:/data
      - applogs:/logs
    networks:
      internal: { ipv4_address: 172.30.0.20 }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 6
  proxy:
    image: caddy:2.10.2
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    environment:
      FRIDAY_HOST: ${FRIDAY_HOST}
      FRIDAY_TLS: ${FRIDAY_TLS}
    ports:
      - '${HTTPS_PORT:-443}:443'
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      internal: { ipv4_address: 172.30.0.10 }
  # One-off tools: `docker compose run --rm migrate` / `docker compose run --rm ops backup /backups/<name>`
  migrate:
    image: friday-app:local
    profiles: [tools]
    depends_on:
      db: { condition: service_healthy }
    environment: *app-env
    networks: [internal]
    command: ['node', 'scripts/migrate-dist.mjs']
  ops:
    image: friday-app:local
    profiles: [tools]
    depends_on:
      db: { condition: service_healthy }
    environment: *app-env
    volumes:
      - appdata:/data
      - applogs:/logs
      - ./backups:/backups
    networks: [internal]
    entrypoint: ['node', 'dist/server/operations/main.js']
networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24
volumes:
  pgdata:
  appdata:
  applogs:
  caddy_data:
